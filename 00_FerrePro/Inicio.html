<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenido</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('imagenes pagina ferreteria/Imagen de fondo inicio y logo/Fondo_ferreteria.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      animation: fadeIn 1.5s ease;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.9s ease;
    }

    .card img {
      max-width: 180px;
      height: auto;
      margin: 10px auto 20px;
      opacity: 0.85;
      mix-blend-mode: multiply;
      border-radius: 12px;
    }

    .btn {
      margin-top: 10px;
      width: 100%;
      font-weight: 600;
      transition: all 0.3s ease-in-out;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    /* Animaciones */
    @keyframes slideUp {
      from {
        transform: translateY(60px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        background-color: rgba(0, 0, 0, 0);
      }
      to {
        background-color: rgba(0, 0, 0, 0.6);
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div id="inicio" class="card">
      <h2>Bienvenidos a</h2>
      <img src="imagenes pagina ferreteria/Imagen de fondo inicio y logo/Logo.jpeg" alt="Logo FerrePro">
      <button class="btn btn-primary" onclick="mostrarFormulario('login')">
        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
      </button>
      <button class="btn btn-secondary" onclick="mostrarFormulario('registro')">
        <i class="bi bi-person-plus-fill"></i> Registrarse
      </button>
      <button class="btn btn-dark" onclick="window.location.href='Ferreteria.html'">
        <i class="bi bi-eye-fill"></i> Ir a la Tienda
      </button>
    </div>

    <div id="login" class="card hidden">
      <h3>Iniciar Sesión</h3>
      <input type="email" id="loginCorreo" class="form-control my-2" placeholder="Correo electrónico" required>
      <input type="password" id="loginContrasena" class="form-control my-2" placeholder="Contraseña" required>
      <button class="btn btn-success" onclick="iniciarSesion()">Entrar</button>
      <button class="btn btn-link" onclick="volver()">Volver</button>
      <div id="loginError" class="text-danger mt-2"></div>
    </div>

    <div id="registro" class="card hidden">
      <h3>Registrarse</h3>
      <input type="text" id="regNombres" class="form-control my-2" placeholder="Nombres" required>
      <input type="text" id="regApellidos" class="form-control my-2" placeholder="Apellidos" required>
      <input type="date" id="regNacimiento" class="form-control my-2" required>
      <input type="email" id="regCorreo" class="form-control my-2" placeholder="Correo electrónico" required>
      <input type="password" id="regContrasena" class="form-control my-2" placeholder="Contraseña" required>
      <button class="btn btn-primary" onclick="registrarUsuario()">Guardar Registro</button>
      <button class="btn btn-link" onclick="volver()">Volver</button>
      <div id="registroExito" class="text-success mt-2"></div>
    </div>
  </div>

  <script>
    function mostrarFormulario(id) {
      document.getElementById("inicio").classList.add("hidden");
      document.getElementById("login").classList.add("hidden");
      document.getElementById("registro").classList.add("hidden");
      document.getElementById(id).classList.remove("hidden");
    }

    function volver() {
      document.getElementById("inicio").classList.remove("hidden");
      document.getElementById("login").classList.add("hidden");
      document.getElementById("registro").classList.add("hidden");
      document.getElementById("loginError").innerText = '';
      document.getElementById("registroExito").innerText = '';
    }

    function registrarUsuario() {
      const usuario = {
        nombres: document.getElementById("regNombres").value,
        apellidos: document.getElementById("regApellidos").value,
        nacimiento: document.getElementById("regNacimiento").value,
        correo: document.getElementById("regCorreo").value,
        contrasena: document.getElementById("regContrasena").value
      };

      localStorage.setItem(usuario.correo, JSON.stringify(usuario));
      document.getElementById("registroExito").innerText = "¡Registro exitoso! Ahora puedes iniciar sesión.";
    }

    function iniciarSesion() {
      const correo = document.getElementById("loginCorreo").value;
      const contrasena = document.getElementById("loginContrasena").value;
      const datos = localStorage.getItem(correo);

      if (datos) {
        const usuario = JSON.parse(datos);
        if (usuario.contrasena === contrasena) {
          window.location.href = "Ferreteria.html";
        } else {
          document.getElementById("loginError").innerText = "Contraseña incorrecta.";
        }
      } else {
        document.getElementById("loginError").innerText = "Usuario no encontrado.";
      }
    }
  </script>
</body>
</html>
